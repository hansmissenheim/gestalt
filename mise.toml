[tools]
python = "3.14.7"
uv = "latest"

[tasks.install]
description = "Install dependencies and configure git hooks"
run = ["uv sync", "git config core.hooksPath .githooks"]

[tasks.serve]
description = "Start local dev server with live reload"
run = "uv run mkdocs serve"

[tasks.build]
description = "Build static site into site/"
run = "uv run mkdocs build"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf site/"
